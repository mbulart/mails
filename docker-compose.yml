services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mails-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8088}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: mails-api:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mails_api}
      MYSQL_USER: ${DB_USERNAME:-mails_api}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mails_api_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-mails_api}", "-p${DB_PASSWORD:-mails_api_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

volumes:
  app_storage:
  app_cache:
  db_data:
